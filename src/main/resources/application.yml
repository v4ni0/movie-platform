spring:
  application:
    name: movie-platform
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/moviedb
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  devtools:
    restart:
      enabled: false
  ai:
    openai:
      api-key: ollama
      base-url: http://localhost:11434
      chat:
        options:
          model: gemma3:1b
          temperature: 0.4

server:
  port: 8099

cors:
  allowed-origin: http://localhost:3000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

tmdb:
  api:
    key: ${TMDB_API_KEY:}

logging:
  level:
    root: WARN
    com.ivan.projects.movieplatform: DEBUG
  file:
    name: logs/app.log